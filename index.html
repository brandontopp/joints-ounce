<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joint Count Calculator</title>
<style>
body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: #ffffff;
}
* { box-sizing: border-box; }
.wrap {
  max-width: 480px;
  margin: 0 auto;
  padding: 28px 20px 32px;
}
.head {
  text-align: center;
  margin-bottom: 22px;
}
.head h2 {
  font-size: 21px;
  font-weight: 700;
  color: #1B3A2F;
  margin: 0 0 6px;
  letter-spacing: -0.2px;
}
.head p {
  font-size: 14px;
  color: #6b7280;
  margin: 0;
}
.btns {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 22px;
}
.btn {
  padding: 11px 18px;
  border-radius: 100px;
  border: 2px solid #1B3A2F;
  background: #ffffff;
  color: #1B3A2F;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
  font-family: inherit;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover { background: #edf5f0; }
.btn.active {
  background: #1B3A2F;
  color: #ffffff;
  transform: scale(1.07);
}
.hero {
  background: #f0f7f3;
  border-radius: 16px;
  padding: 26px 20px 22px;
  text-align: center;
  margin-bottom: 20px;
}
.hero-label {
  font-size: 11px;
  font-weight: 700;
  color: #1B3A2F;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  opacity: 0.6;
  margin-bottom: 8px;
}
.hero-num {
  font-size: 76px;
  font-weight: 700;
  color: #1B3A2F;
  line-height: 1;
  margin: 0 0 8px;
  font-variant-numeric: tabular-nums;
}
.hero-sub {
  font-size: 14px;
  color: #1B3A2F;
  opacity: 0.6;
  font-weight: 500;
}
.hero.pop .hero-num {
  animation: popIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes popIn {
  0%   { transform: scale(0.88); opacity: 0.3; }
  100% { transform: scale(1);    opacity: 1;   }
}
.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #e5e7eb;
  margin-bottom: 14px;
}
.tbl thead tr { background-color: #1B3A2F; color: #ffffff; }
.tbl th {
  padding: 10px 14px;
  text-align: left;
  font-weight: 600;
  font-size: 13px;
}
.tbl th:last-child { text-align: right; }
.tbl td { padding: 10px 14px; transition: background 0.35s ease; }
.tbl td:last-child { text-align: right; font-weight: 700; color: #1B3A2F; }
.odd  { background-color: #FDF8F0; }
.even { background-color: #F5EFE3; }
.flash { background-color: #b8dfc9 !important; }
.foot {
  text-align: center;
  font-size: 12px;
  color: #9ca3af;
}
</style>
</head>
<body>

<div class="wrap">

  <div class="head">
    <h2>How Many Joints in Your Ounce?</h2>
    <p>Tap your fill weight and see the math update.</p>
  </div>

  <div class="btns">
    <button class="btn" data-w="0.25" onclick="pick(this)">0.25g</button>
    <button class="btn" data-w="0.3"  onclick="pick(this)">0.3g</button>
    <button class="btn active" data-w="0.5" onclick="pick(this)">0.5g</button>
    <button class="btn" data-w="0.7"  onclick="pick(this)">0.7g</button>
    <button class="btn" data-w="1.0"  onclick="pick(this)">1.0g</button>
  </div>

  <div class="hero" id="hero">
    <div class="hero-label">Joints per ounce</div>
    <div class="hero-num" id="mainNum">56</div>
    <div class="hero-sub" id="heroSub">at 0.5g per joint</div>
  </div>

  <table class="tbl">
    <thead>
      <tr><th>Purchase Size</th><th>Your Count</th></tr>
    </thead>
    <tbody>
      <tr class="odd">  <td>1 gram</td>          <td id="c0">2</td></tr>
      <tr class="even"> <td>Eighth (3.5g)</td>    <td id="c1">7</td></tr>
      <tr class="odd">  <td>Quarter (7g)</td>     <td id="c2">14</td></tr>
      <tr class="even"> <td>Half ounce (14g)</td> <td id="c3">28</td></tr>
      <tr class="odd">  <td>Ounce (28g)</td>      <td id="c4">56</td></tr>
    </tbody>
  </table>

  <p class="foot">Based on the industry-standard 28g ounce. Counts show complete joints.</p>

</div>

<script>
var grams  = [1, 3.5, 7, 14, 28];
var cellIds = ['c0','c1','c2','c3','c4'];
var currentW = 0.5;
var raf;

function joints(g, w) {
  return Math.floor(g / w);
}

function animCount(el, from, to, ms) {
  cancelAnimationFrame(raf);
  var t0 = null;
  function step(ts) {
    if (!t0) t0 = ts;
    var p = Math.min((ts - t0) / ms, 1);
    var ease = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * ease);
    if (p < 1) raf = requestAnimationFrame(step);
    else el.textContent = to;
  }
  raf = requestAnimationFrame(step);
}

function flash(id) {
  var td = document.getElementById(id);
  var tr = td.parentElement;
  tr.classList.add('flash');
  setTimeout(function() { tr.classList.remove('flash'); }, 380);
}

function pick(btn) {
  document.querySelectorAll('.btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');

  var w   = parseFloat(btn.getAttribute('data-w'));
  var from = parseInt(document.getElementById('mainNum').textContent) || joints(28, currentW);
  var to   = joints(28, w);
  currentW = w;

  document.getElementById('heroSub').textContent = 'at ' + btn.textContent + ' per joint';

  var hero = document.getElementById('hero');
  hero.classList.remove('pop');
  void hero.offsetWidth;
  hero.classList.add('pop');

  animCount(document.getElementById('mainNum'), from, to, 380);

  cellIds.forEach(function(id, i) {
    document.getElementById(id).textContent = joints(grams[i], w);
    flash(id);
  });
}
</script>

</body>
</html>
